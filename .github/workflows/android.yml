name: build-android

on:
  workflow_dispatch:
  push:
    branches: [ android-port-v1 ]
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'

# Only the newest branch/PR build should establish or consume the debug-signing
# cache. This also prevents several freshly queued commits from generating
# different first-use debug keys before the cache has been saved.
concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing keystore
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/subrenamer-debug.keystore
          key: subrenamer-android-debug-signing-v1

      - name: Create debug signing keystore on first use
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          keytool -genkeypair \
            -keystore .ci-signing/subrenamer-debug.keystore \
            -storetype PKCS12 \
            -storepass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -keypass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -alias subrenamer-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=SubRenamer Android CI Debug,O=SubRenamer'

      - name: Run original SubRenamer tests
        run: dotnet test SubRenamer.Tests/SubRenamer.Tests.csproj -c Release --verbosity normal

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Run Android integration tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Android/tests/SubRenamer.Mobile.Tests/SubRenamer.Mobile.Tests.csproj -c Release --verbosity normal 2>&1 | tee Android/mobile-test.log

      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-test-diagnostics
          path: Android/mobile-test.log
          if-no-files-found: warn

      - name: Build self-contained debug-signed APK
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -o pipefail
          dotnet build Android/src/SubRenamer.Mobile.Android/SubRenamer.Mobile.Android.csproj \
            -c Debug -f net10.0-android -t:SignAndroidPackage \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/.ci-signing/subrenamer-debug.keystore" \
            -p:AndroidSigningStorePass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            -p:AndroidSigningKeyAlias=subrenamer-debug \
            -p:AndroidSigningKeyPass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            --verbosity normal 2>&1 | tee Android/android-build.log

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-build-diagnostics
          path: Android/android-build.log
          if-no-files-found: warn

      - name: Collect and verify standalone APK
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p artifacts
          signed_apk="$(find Android/src/SubRenamer.Mobile.Android/bin -type f -name '*-Signed.apk' -print -quit)"
          test -n "$signed_apk"
          echo "Signed APK: $signed_apk"
          unzip -Z1 "$signed_apk" > artifacts/apk-contents.txt

          # .NET 10 Android packages embedded managed assemblies as lib_<name>.dll.so.
          # Require the app, shared mobile layer and original Core in the arm64 payload.
          grep -Fxq 'lib/arm64-v8a/lib_SubRenamer.Mobile.Android.dll.so' artifacts/apk-contents.txt
          grep -Fxq 'lib/arm64-v8a/lib_SubRenamer.Mobile.dll.so' artifacts/apk-contents.txt
          grep -Fxq 'lib/arm64-v8a/lib_SubRenamer.Core.dll.so' artifacts/apk-contents.txt

          keytool -list -v \
            -keystore .ci-signing/subrenamer-debug.keystore \
            -storepass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -alias subrenamer-debug > artifacts/debug-signing-certificate.txt

          cp "$signed_apk" artifacts/SubRenamer-Android-debug-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-debug
          path: |
            artifacts/SubRenamer-Android-debug-signed.apk
            artifacts/apk-contents.txt
            artifacts/debug-signing-certificate.txt
          if-no-files-found: error
