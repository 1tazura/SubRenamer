name: build-android

on:
  workflow_dispatch:
  push:
    branches: [ android-port-v1 ]
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run original SubRenamer tests
        run: dotnet test SubRenamer.Tests/SubRenamer.Tests.csproj -c Release --verbosity normal

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Run Android integration tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Android/tests/SubRenamer.Mobile.Tests/SubRenamer.Mobile.Tests.csproj -c Release --verbosity normal 2>&1 | tee Android/mobile-test.log

      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-test-diagnostics
          path: Android/mobile-test.log
          if-no-files-found: warn

      - name: Build debug-signed APK
        shell: bash
        run: |
          set -o pipefail
          dotnet build Android/src/SubRenamer.Mobile.Android/SubRenamer.Mobile.Android.csproj -c Debug -f net10.0-android -t:SignAndroidPackage --verbosity normal 2>&1 | tee Android/android-build.log

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-build-diagnostics
          path: Android/android-build.log
          if-no-files-found: warn

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find Android/src/SubRenamer.Mobile.Android/bin -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-debug
          path: artifacts/
          if-no-files-found: error
