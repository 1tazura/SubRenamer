name: build-android

on:
  workflow_dispatch:
  push:
    branches: [ android-port-v1 ]
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run original SubRenamer tests
        run: dotnet test SubRenamer.Tests/SubRenamer.Tests.csproj -c Release --verbosity normal

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Run Android integration tests
        shell: bash
        run: |
          set +e
          dotnet test Android/tests/SubRenamer.Mobile.Tests/SubRenamer.Mobile.Tests.csproj -c Release --verbosity diagnostic 2>&1 | tee Android/mobile-test.log
          code=${PIPESTATUS[0]}
          echo "$code" > Android/mobile-test-exit.txt
          exit 0

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-test-diagnostics
          path: |
            Android/mobile-test.log
            Android/mobile-test-exit.txt
          if-no-files-found: warn

      - name: Fail on Android integration test errors
        shell: bash
        run: |
          code=$(cat Android/mobile-test-exit.txt)
          if [ "$code" -ne 0 ]; then
            echo "Android integration tests failed with exit code $code"
            exit "$code"
          fi

      - name: Build debug-signed APK
        run: >
          dotnet build
          Android/src/SubRenamer.Mobile.Android/SubRenamer.Mobile.Android.csproj
          -c Debug
          -f net10.0-android
          -t:SignAndroidPackage
          --verbosity normal

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find Android/src/SubRenamer.Mobile.Android/bin -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-debug
          path: artifacts/
          if-no-files-found: error
