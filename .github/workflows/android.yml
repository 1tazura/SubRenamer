name: build-android

on:
  workflow_dispatch:
  push:
    branches: [ android-port-v1 ]
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'SubRenamer.Core/**'
      - 'SubRenamer.Tests/**'
      - '.github/workflows/android.yml'

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing keystore
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/subrenamer-debug.keystore
          key: subrenamer-android-debug-signing-v1

      - name: Create debug signing keystore on first use
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          keytool -genkeypair \
            -keystore .ci-signing/subrenamer-debug.keystore \
            -storetype PKCS12 \
            -storepass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -keypass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -alias subrenamer-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=SubRenamer Android CI Debug,O=SubRenamer'

      - name: Run original SubRenamer tests
        run: dotnet test SubRenamer.Tests/SubRenamer.Tests.csproj -c Release --verbosity normal

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Run Android integration tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Android/tests/SubRenamer.Mobile.Tests/SubRenamer.Mobile.Tests.csproj -c Release --verbosity normal 2>&1 | tee Android/mobile-test.log

      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-test-diagnostics
          path: Android/mobile-test.log
          if-no-files-found: warn

      - name: Clean Android publish intermediates
        shell: bash
        run: |
          find Android/src -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          mkdir -p artifacts

      - name: Publish arm64 debug-signed APK
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail
          dotnet publish Android/src/SubRenamer.Mobile.Android/SubRenamer.Mobile.Android.csproj \
            -c Debug -f net10.0-android -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:EmbedAssembliesIntoApk=true \
            -p:RunAOTCompilation=false \
            -p:AndroidEnableProfiledAot=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/.ci-signing/subrenamer-debug.keystore" \
            -p:AndroidSigningStorePass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            -p:AndroidSigningKeyAlias=subrenamer-debug \
            -p:AndroidSigningKeyPass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            --verbosity normal 2>&1 | tee Android/android-debug-build.log

          debug_apk="$(find Android/src/SubRenamer.Mobile.Android/bin/Debug -type f -name '*-Signed.apk' -print -quit)"
          test -n "$debug_apk"
          cp "$debug_apk" artifacts/SubRenamer-Android-arm64-debug.apk

      - name: Clean before release candidate
        shell: bash
        run: find Android/src -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

      - name: Publish arm64 release-trimmed candidate APK
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail
          dotnet publish Android/src/SubRenamer.Mobile.Android/SubRenamer.Mobile.Android.csproj \
            -c Release -f net10.0-android -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:EmbedAssembliesIntoApk=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:RunAOTCompilation=false \
            -p:AndroidEnableProfiledAot=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/.ci-signing/subrenamer-debug.keystore" \
            -p:AndroidSigningStorePass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            -p:AndroidSigningKeyAlias=subrenamer-debug \
            -p:AndroidSigningKeyPass=env:SUBRENAMER_ANDROID_SIGNING_PASSWORD \
            --verbosity normal 2>&1 | tee Android/android-release-build.log

          release_apk="$(find Android/src/SubRenamer.Mobile.Android/bin/Release -type f -name '*-Signed.apk' -print -quit)"
          test -n "$release_apk"
          cp "$release_apk" artifacts/SubRenamer-Android-arm64-release-trimmed.apk

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-build-diagnostics
          path: |
            Android/android-debug-build.log
            Android/android-release-build.log
          if-no-files-found: warn

      - name: Compare and verify APKs
        shell: bash
        env:
          SUBRENAMER_ANDROID_SIGNING_PASSWORD: android
        run: |
          set -euo pipefail

          unzip -Z1 artifacts/SubRenamer-Android-arm64-debug.apk > artifacts/apk-contents-debug.txt
          unzip -Z1 artifacts/SubRenamer-Android-arm64-release-trimmed.apk > artifacts/apk-contents-release.txt

          for listing in artifacts/apk-contents-debug.txt artifacts/apk-contents-release.txt; do
            grep -q '^lib/arm64-v8a/' "$listing"
            if grep -q '^lib/x86_64/' "$listing"; then
              echo "Unexpected x86_64 payload in $listing" >&2
              exit 1
            fi
          done

          debug_bytes="$(stat -c%s artifacts/SubRenamer-Android-arm64-debug.apk)"
          release_bytes="$(stat -c%s artifacts/SubRenamer-Android-arm64-release-trimmed.apk)"
          {
            echo "arm64 debug bytes=$debug_bytes"
            echo "arm64 release-trimmed bytes=$release_bytes"
            awk -v d="$debug_bytes" -v r="$release_bytes" 'BEGIN { printf "release_vs_debug_reduction=%.1f%%\n", (d-r)*100/d }'
          } | tee artifacts/apk-size-report.txt

          keytool -list -v \
            -keystore .ci-signing/subrenamer-debug.keystore \
            -storepass "$SUBRENAMER_ANDROID_SIGNING_PASSWORD" \
            -alias subrenamer-debug > artifacts/debug-signing-certificate.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubRenamer-Android-arm64
          path: |
            artifacts/SubRenamer-Android-arm64-debug.apk
            artifacts/SubRenamer-Android-arm64-release-trimmed.apk
            artifacts/apk-contents-debug.txt
            artifacts/apk-contents-release.txt
            artifacts/apk-size-report.txt
            artifacts/debug-signing-certificate.txt
          if-no-files-found: error
